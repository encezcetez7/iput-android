
name: Build IPUT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IPUT_github_build_ready.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract IPUT project
        run: |
          unzip -q IPUT_github_build_ready.zip -d extracted
          test -d extracted/IPUT/android

      - name: Build APK
        working-directory: extracted/IPUT/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPUT-debug-APK
          path: extracted/IPUT/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
